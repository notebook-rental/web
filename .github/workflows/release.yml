# main 에 들어오면: 검사·테스트 → 이미지 빌드·push(ghcr.io/notebook-rental/web:<git SHA>)
# → deploy repo 의 overlays/prod/web 이미지 태그 갱신 → Argo CD 가 반영.
# 설명: notebook-rental/deploy 의 docs/ci-release.md
# 필요한 저장소 Secret: DEPLOY_REPO_TOKEN (deploy repo Contents 쓰기만 가진 fine-grained 토큰)
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # 같은 커밋으로 다시 배포해야 할 때 Actions 화면에서 수동 실행

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - name: 단위 테스트 + 커버리지(80% 미만이면 실패)
        run: npm run test:coverage

  release:
    needs: test
    permissions:
      contents: read
      packages: write # ghcr.io 에 push
    uses: notebook-rental/deploy/.github/workflows/release-image.yml@main
    with:
      app: web
    secrets:
      DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
